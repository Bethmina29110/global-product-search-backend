name: Deploy to EC2

on:
  push:
    branches:
      - deploy # Change this to your main branch name if different

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via native SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          # Set up SSH key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          
          # Fix Windows line endings in the key just in case
          sed -i 's/\r$//' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add host to known_hosts to prevent interactive prompt
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          
          # Execute commands over SSH
          ssh -i ~/.ssh/id_rsa $USERNAME@$HOST << 'EOF'
            echo "Starting deployment..."
            cd ~/bethimna/backend
            
            echo "Pulling latest code..."
            git pull origin deploy
            
            echo "Installing dependencies..."
            npm install
            
            echo "Building project..."
            npm run build
            
            echo "Restarting application..."
            pm2 restart bethimna-backend || pm2 start dist/main.js --name "bethimna-backend"
            
            echo "Deployment finished successfully!"
          EOF

